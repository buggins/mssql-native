name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.dc }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, dc: dmd-latest }
          - { os: ubuntu-22.04, dc: ldc-latest }
          # Minimum supported D frontend: 2.097 (the same as ddbc)
          - { os: ubuntu-22.04, dc: dmd-2.097.2 }
          - { os: ubuntu-22.04, dc: ldc-1.27.1 }
          # Releases in between (LDC 1.30, 1.35 and 1.40 have frontends 2.100, 2.105 and 2.110)
          - { os: ubuntu-22.04, dc: dmd-2.100.2 }
          - { os: ubuntu-22.04, dc: dmd-2.105.3 }
          - { os: ubuntu-22.04, dc: dmd-2.109.1 }
          - { os: ubuntu-22.04, dc: ldc-1.30.0 }
          - { os: ubuntu-22.04, dc: ldc-1.35.0 }
          - { os: ubuntu-22.04, dc: ldc-1.40.1 }
          - { os: windows-latest, dc: dmd-latest }
          - { os: windows-latest, dc: ldc-latest }
          # DMD does not target arm64 macOS runners. LDC before 1.41 builds programs that
          # crash on current macOS (even hello world), so 1.41.0 is the oldest LDC tested there.
          - { os: macos-latest, dc: ldc-latest }
          - { os: macos-latest, dc: ldc-1.41.0 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dlang-community/setup-dlang@v2.0.0
        with:
          compiler: ${{ matrix.dc }}
      - name: Cache dub packages and builds
        uses: actions/cache@v6
        with:
          path: |
            ~/.dub/packages
            ~/.dub/cache
            ~/AppData/Local/dub/packages
            ~/AppData/Local/dub/cache
          key: dub-${{ github.job }}-${{ runner.os }}-${{ matrix.dc }}-${{ hashFiles('**/dub.json') }}
          restore-keys: dub-${{ github.job }}-${{ runner.os }}-${{ matrix.dc }}-
      - name: Build
        run: dub build
      - name: Unit tests
        run: dub test
      - name: Unit tests with -preview=dip1000
        if: matrix.os == 'ubuntu-22.04' && (matrix.dc == 'ldc-latest' || matrix.dc == 'dmd-latest')
        env:
          DFLAGS: -preview=dip1000 -unittest -g
        run: dub test
      # Without MSSQL_HOST the runners skip the server tests: this checks that they build and run
      - name: Integration test runners (threads)
        run: dub run :integration-tests-phobos
      - name: Integration test runners (vibe.d fibers)
        run: dub run :integration-tests-vibe
      - name: Build examples
        run: |
          dub build :example-basic
          dub build :example-vibe

  integration:
    name: server (SQL Server ${{ matrix.mssql }})
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported version, and the newer ones
        mssql: ["2017", "2019", "2022"]
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:${{ matrix.mssql }}-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: Test_password123
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Test_password123 -Q 'SELECT 1'
          || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P Test_password123 -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    env:
      MSSQL_HOST: localhost:1433
      MSSQL_USER: sa
      MSSQL_PASSWORD: Test_password123
    steps:
      - uses: actions/checkout@v7
      - uses: dlang-community/setup-dlang@v2.0.0
        with:
          compiler: ldc-latest
      - name: Server is reachable
        run: |
          docker exec ${{ job.services.mssql.id }} sh -c \
            "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Test_password123 -Q 'SELECT @@VERSION' \
             || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P Test_password123 -Q 'SELECT @@VERSION'"
      - name: Integration tests (threads)
        run: dub run :integration-tests-phobos
      - name: Integration tests (vibe.d fibers)
        run: dub run :integration-tests-vibe
      - name: Integration tests (vibe-core 1.x)
        run: dub run :integration-tests-vibe1
      - name: Run examples
        env:
          MSSQL_CONNECTION: Server=localhost,1433;User Id=sa;Password=Test_password123;TrustServerCertificate=True
        run: |
          dub run :example-basic
          dub run :example-vibe

  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dlang-community/setup-dlang@v2.0.0
        with:
          compiler: ldc-latest
      - name: Cache dub packages and builds
        uses: actions/cache@v6
        with:
          path: |
            ~/.dub/packages
            ~/.dub/cache
          key: dub-${{ github.job }}-${{ runner.os }}-ldc-latest-${{ hashFiles('**/dub.json') }}
          restore-keys: dub-${{ github.job }}-${{ runner.os }}-ldc-latest-
      - name: D-Scanner style check
        run: dub run -q dscanner@0.15.2 -- --styleCheck .
      - name: dfmt formatting check
        run: |
          dub run -q dfmt@0.15.2 -- --inplace $(git ls-files '*.d')
          git diff --exit-code
      - name: Documentation builds
        run: dub build -b docs
